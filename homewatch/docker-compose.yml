services:
  homewatch:
    build: .
    container_name: omarchytv-homewatch
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TV_IP: "${TV_IP:?TV_IP must be set in the stack environment}"
      TARGET_APP_ID: "${TARGET_APP_ID:-com.omarchytv.home}"
      HOME_APP_IDS: "${HOME_APP_IDS:-com.webos.app.home,com.webos.launcher}"
      SCREENSAVER_APP_IDS: "${SCREENSAVER_APP_IDS:-com.webos.app.screensaver,com.webos.screensaver}"
      SSAP_URL: "${SSAP_URL:-}"
      STATE_FILE: /data/client-key.json
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    networks:
      - homewatch

networks:
  homewatch:
    name: omarchytv-homewatch
    driver: bridge
